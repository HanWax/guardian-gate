name: WhatsApp Cron

# Fires the three attendance cron endpoints every 5 minutes during the
# Israel morning window. Each endpoint internally checks whether the
# current time matches any nursery's configured firing time (5-minute
# tolerance) and no-ops otherwise — safe to over-invoke.
#
# Window: 03:00–08:00 UTC covers 05:00–11:00 IDT (summer) and
# 05:00–10:00 IST (winter), comfortably wider than the configurable
# morning/ping/9am times.
#
# Required repository secrets:
#   DEPLOY_URL    — e.g. https://rolecall.vercel.app (no trailing slash)
#   CRON_SECRET   — bearer token matching CRON_SECRET on Vercel

on:
  schedule:
    - cron: "*/5 3-8 * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-cron
  cancel-in-progress: false

jobs:
  fire:
    name: Fire attendance cron endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are set
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::DEPLOY_URL or CRON_SECRET secret is not set"
            exit 1
          fi

      - name: POST /api/cron/morning-messages
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 60 \
            -X POST "$DEPLOY_URL/api/cron/morning-messages" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

      - name: POST /api/cron/second-ping
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 60 \
            -X POST "$DEPLOY_URL/api/cron/second-ping" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

      - name: POST /api/cron/nine-am-check
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 60 \
            -X POST "$DEPLOY_URL/api/cron/nine-am-check" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
